services:
  jump-game:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-unknown}
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
    image: jump-game:${APP_VERSION:-0.0.0-unknown}
    container_name: jump-game
    ports:
      - '3000:80'
    restart: unless-stopped
    networks:
      - game-network
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

networks:
  game-network:
    driver: bridge
