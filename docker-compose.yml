version: '3.8'

x-build-args: &build-args
  VERSION: ${APP_VERSION:-1.0.0-local}
  BUILD_DATE: ${BUILD_DATE:-unknown}
  GIT_COMMIT: ${GIT_COMMIT:-unknown}

services:
  jump-game:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *build-args
    image: jump-game:${APP_VERSION:-latest}
    container_name: jump-game
    ports:
      - '3000:80'
    restart: unless-stopped
    networks:
      - game-network
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    labels:
      - "app.version=${APP_VERSION:-1.0.0-local}"
      - "app.build-date=${BUILD_DATE:-unknown}"
      - "app.git-commit=${GIT_COMMIT:-unknown}"

networks:
  game-network:
    driver: bridge
